<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3f5f4"><title>Stockbook · 共用帳本 B 版</title>
<style>
/* B 版樣式：安靜的帳本，數字當主角。紅漲綠跌、買紅賣綠（台股習慣）；品牌青綠只用在導覽與一般按鈕。 */
:root{--ink:#14262d;--muted:#52666e;--faint:#6b7d84;--line:#e3e9eb;--field:#849299;--bg:#f3f5f4;--page:#e6ebec;--surface:#fff;
--teal:#0b7a6e;--teal-soft:#e5f2ef;--up:#d2342a;--up-soft:#fde9e7;--down:#16884a;--down-soft:#e5f4ea;--amber:#9a5f06;--amber-bar:#c27a0c;--amber-soft:#fdf3e2;
--hero-up:#ff9a8c;--hero-down:#7fdca3;--shadow:0 16px 60px #182f3520}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans CJK TC","Microsoft JhengHei",sans-serif;font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit}button{cursor:pointer;color:inherit;-webkit-tap-highlight-color:transparent;border:0}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid #62b5a9;outline-offset:2px}
button:disabled{cursor:default;opacity:.48}
svg{display:inline-block;width:22px;height:22px;vertical-align:middle;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
h1,h2,h3,p{margin:0}h1{font-size:22px;letter-spacing:-.4px;line-height:1.35}h2{font-size:16px}h3{font-size:15px}
.up{color:var(--up)}.down{color:var(--down)}
.app{position:relative;max-width:480px;min-height:100dvh;margin:auto;background:var(--bg);overflow-x:clip}
.top{padding:14px 20px 8px;display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--bg)}
.brand{font-size:18px;font-weight:800;letter-spacing:-.5px;display:flex;align-items:center;gap:7px;white-space:nowrap}
.brand-mark{width:24px;height:24px;display:grid;place-items:center;background:var(--teal);color:#fff;border-radius:7px}.brand-mark svg{width:16px;height:16px}
.badge{font-size:12px;font-weight:600;line-height:1;background:#e3eaec;color:#4b626a;padding:4px 6px;border-radius:5px}
.account{font-size:13px;font-weight:600;min-height:44px;display:flex;gap:4px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:0 10px 0 12px;color:var(--ink);min-width:0;max-width:62%}
.account span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.account svg{width:16px;height:16px;color:var(--muted)}
.content{padding:4px 20px 104px;display:flex;flex-direction:column;gap:20px}
.content>*{margin:0}
.eyebrow{font-size:12px;color:var(--muted);letter-spacing:.4px;font-weight:500}
.page-head{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px}
.page-title p{font-size:13px;color:var(--muted);margin-top:4px}
.hero{background:var(--ink);color:#fff;border-radius:18px;padding:20px 20px 18px;margin-top:-8px}
.hero .eyebrow{color:#b2c6ca}
.amount{font-size:34px;font-weight:700;letter-spacing:-1.2px;line-height:1.2;margin:6px 0 4px}
.amount .currency{font-size:15px;color:#b8cbd0;font-weight:450;margin-right:7px;letter-spacing:0}
.hero-pnl{font-size:15px;font-weight:650;color:#e6eef0}.hero-pnl.up{color:var(--hero-up)}.hero-pnl.down{color:var(--hero-down)}
.hero-pnl span{font-size:12px;color:#b8cbd0;font-weight:400;margin-left:8px}
.hero-grid{border-top:1px solid #ffffff22;display:grid;grid-template-columns:1fr 1fr;margin-top:16px;padding-top:12px;gap:14px}
.hero-grid span{font-size:12px;color:#b8cbd0;display:block}.hero-grid b{font-size:18px;font-weight:600;display:block;margin-top:2px}
.hero-grid div+div{border-left:1px solid #ffffff22;padding-left:16px}
.hero-hint{margin-top:-12px!important}
.todo{background:var(--amber-soft);border-left:4px solid var(--amber-bar);border-radius:12px;padding:6px 6px 6px 14px}
.todo-title{font-size:13px;font-weight:700;color:var(--amber);padding:6px 0 2px}
.task{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:transparent;min-height:52px;padding:6px 8px 6px 0;border-top:1px solid #f1dfbd}
.task:first-of-type{border-top:0}
.task strong{display:block;font-size:15px;color:#5b3a04}.task small{display:block;color:#7a5512;font-size:12px}.task>svg{margin-left:auto;width:18px;color:var(--amber)}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.quick button{min-height:52px;border-radius:12px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:16px;font-weight:700}
.buy-button{background:var(--up);color:#fff}.sell-button{background:var(--surface);color:var(--down);box-shadow:inset 0 0 0 1.5px var(--down)}
.section-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.link{color:var(--teal);background:transparent;min-height:44px;font-weight:600;padding:4px 0;font-size:14px;display:inline-flex;align-items:center;gap:3px;text-decoration:none}.link svg{width:16px;height:16px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.trade-row,.stock-row{display:flex;align-items:center;text-align:left;gap:11px;background:var(--surface);width:100%;padding:11px 14px;min-height:64px;border-bottom:1px solid var(--line)}
.trade-row:last-child,.stock-row:last-child{border-bottom:0}
.trade-icon{width:30px;height:30px;flex:0 0 30px;display:grid;place-items:center;font-size:13px;font-weight:700;border-radius:9px}
.trade-icon.buy{background:var(--up-soft);color:var(--up)}.trade-icon.sell{background:var(--down-soft);color:var(--down)}
.trade-main{min-width:0;flex:1}.trade-main strong{font-size:15px;font-weight:650;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.code{color:var(--muted);font-size:12px;margin-left:6px;font-weight:450}
.trade-main small{color:var(--muted);font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trade-end{text-align:right;flex:0 0 auto}.trade-end b{font-size:15px;font-weight:650;display:block}.trade-end small{font-size:12px;color:var(--muted);display:block}
.trade-end small.up{color:var(--up)}.trade-end small.down{color:var(--down)}
.col-head{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);padding:0 4px;margin-bottom:-14px!important}
.quiet{font-size:12px;line-height:1.6;color:var(--muted)}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,480px);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 7px calc(6px + env(safe-area-inset-bottom));background:#fffffff5;backdrop-filter:blur(16px);border-top:1px solid var(--line);z-index:20}
.nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:52px;background:transparent;color:var(--muted);font-size:12px;font-weight:550;border-radius:10px;position:relative}
.nav button svg{width:23px;height:23px}.nav button.active{color:var(--teal);font-weight:700}.nav button.active svg{stroke-width:2.2}
.search{display:flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--field);border-radius:12px;padding:0 12px;min-height:46px}
.search svg{width:19px;height:19px;color:var(--muted)}.search input{border:0;outline:none;min-width:0;width:100%;background:transparent;padding:11px 0;font-size:16px;color:var(--ink)}
.search:focus-within{outline:3px solid #62b5a9;outline-offset:2px}
.tabs{display:flex;background:#e3e9eb;border-radius:11px;padding:3px;gap:3px}
.tabs button{flex:1;min-height:40px;background:transparent;border-radius:8px;font-size:14px;font-weight:600;color:var(--muted)}
.tabs button.active{background:var(--surface);color:var(--ink);box-shadow:0 1px 4px #223a4018}
.content>.tabs.period{margin-top:-8px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:0 14px;background:var(--surface);border:1px solid var(--line);border-radius:22px;font-size:13px;min-height:36px;font-weight:550;color:var(--muted)}
.chip.active{border-color:var(--ink);color:var(--ink);font-weight:700}
.filter-line{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-bottom:4px}.filter-line small{font-size:13px;color:var(--muted);white-space:nowrap}
#trade-results{display:flex;flex-direction:column;gap:8px;margin-top:-8px}
.date-label{font-size:13px;font-weight:650;color:var(--ink);display:flex;justify-content:space-between;margin:10px 4px 0}.date-label span{font-weight:400;color:var(--muted)}
.empty{padding:32px 20px;text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;color:var(--muted);font-size:14px}
.empty svg{display:block;width:30px;height:30px;margin:0 auto 10px}
.summary-strip{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:-8px}
.summary-strip small{display:block;font-size:12px;color:var(--muted)}.summary-strip b{font-size:20px;letter-spacing:-.4px}
.tag{display:inline-block;border-radius:6px;background:#eef3f4;padding:3px 8px;font-size:12px;color:#4b626a;white-space:nowrap}
.tag.warning{background:var(--amber-soft);color:var(--amber)}.tag.good{background:var(--teal-soft);color:#076157}
.stock-head{display:flex;align-items:center;justify-content:space-between;gap:10px}.stock-head strong{font-size:15px;font-weight:650}
.recon-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.content>.recon-card+.recon-card{margin-top:-10px}
.recon-card p{font-size:13px;color:var(--muted);margin:4px 0 10px}
.recon-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.recon-grid small{display:block;font-size:12px;color:var(--muted)}.recon-grid b{font-size:17px;font-weight:600}
.recon-footer{display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--line);font-size:13px;min-height:44px}
.primary{border-radius:11px;background:var(--teal);color:#fff;font-size:15px;font-weight:700;padding:12px 18px;min-height:48px;text-decoration:none}
.primary.buy{background:var(--up)}.primary.sell{background:var(--down)}
.secondary{border-radius:11px;background:#e7edef;color:#2c4a52;font-size:15px;font-weight:600;padding:12px 16px;min-height:48px}
.secondary.buy-text{color:var(--up)}
.danger{border-radius:11px;background:var(--up);color:#fff;font-size:15px;font-weight:700;padding:12px 16px;min-height:48px}
.danger-link{display:block;margin:16px auto 0;background:transparent;color:var(--up);font-size:14px;font-weight:600;min-height:44px;padding:0 12px}
.wide{width:100%}
.menu-section{display:flex;flex-direction:column;gap:8px}.menu-section .eyebrow{margin-left:3px}
.menu-row{display:flex;align-items:center;gap:12px;background:var(--surface);width:100%;min-height:60px;padding:10px 15px;text-align:left;border-bottom:1px solid var(--line)}
.menu-row:last-child{border:0}.menu-row>svg:first-child{color:#4b6d76;width:20px}.menu-row>svg:last-child{margin-left:auto;width:17px;color:var(--muted)}
.menu-row strong{font-size:15px;font-weight:600;display:block}.menu-row small{font-size:12px;color:var(--muted);display:block}
.menu-row .tag{margin-left:auto}
.alert{font-size:13px;line-height:1.7;padding:12px 14px;background:var(--amber-soft);color:#5b3a04;border-left:4px solid var(--amber-bar);border-radius:10px}
.avatar{width:40px;height:40px;border-radius:12px;background:var(--teal-soft);color:var(--teal);font-size:17px;font-weight:700;display:grid;place-items:center}
.profile{display:flex;gap:12px;align-items:center;margin-top:-6px!important}.profile strong{font-size:16px;display:block}.profile small{font-size:13px;color:var(--muted);display:block}
.overlay{position:fixed;inset:0;background:#0d252761;z-index:50;display:flex;justify-content:center;align-items:flex-end;backdrop-filter:blur(3px)}
.sheet{background:var(--bg);width:min(100%,480px);max-height:93dvh;border-radius:22px 22px 0 0;overflow:auto;box-shadow:var(--shadow);padding:0 20px;overscroll-behavior:contain}
.sheet::after{content:"";display:block;height:calc(20px + env(safe-area-inset-bottom))}
.sheet-handle{width:35px;height:4px;background:#cbd7db;border-radius:9px;margin:10px auto 4px}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:8px 0 14px;position:sticky;top:0;background:var(--bg);z-index:3}.sheet-head h2{font-size:19px}
.sheet-eyebrow{margin:12px 0 8px 3px}.sheet .list+.sheet-eyebrow{margin-top:18px}
.close{display:grid;place-items:center;width:44px;height:44px;background:#e3e9eb;border-radius:50%}.close svg{width:20px;height:20px}
#trade-form>.tabs{margin-bottom:16px}
#trade-form.sell .type-tabs .active{background:var(--down);color:#fff}#trade-form.buy .type-tabs .active{background:var(--up);color:#fff}
.form-field{margin-bottom:14px}.form-field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
.form-field input,.form-field select,.form-field textarea{display:block;width:100%;min-width:0;min-height:48px;border:1px solid var(--field);border-radius:10px;padding:11px 12px;background:var(--surface);color:var(--ink);font-size:16px}
.form-field textarea{min-height:74px;resize:vertical}.form-pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-field label small{font-size:12px;color:var(--muted);font-weight:400;margin-left:6px}
.hint{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.65}
.avail{font-size:13px;margin-top:8px;padding:7px 10px;border-radius:8px;background:#e7edef;color:#2c4a52}
#trade-form.sell .avail{background:var(--down-soft);color:#0f5e33}.avail .warn{color:var(--up);font-weight:600}
.lots{border:0;padding:0;margin:0 0 14px}.lots legend{font-size:13px;font-weight:600;margin-bottom:6px;padding:0}
.lot{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:6px;display:flex;align-items:center;gap:12px;font-size:14px;min-height:52px}
.lot input{width:22px;height:22px;accent-color:var(--down);flex:0 0 auto}.lot span{flex:1}.lot small{font-size:12px;color:var(--muted);display:block;margin-top:2px}.lot em{font-style:normal;font-weight:700;color:var(--down)}
.form-preview{background:var(--surface);border:1px solid var(--line);border-radius:11px;display:flex;align-items:center;justify-content:space-between;padding:12px 14px;font-size:13px;color:var(--muted);margin-bottom:14px}.form-preview b{font-size:19px;color:var(--ink)}
.sheet-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.sticky-submit{position:sticky;bottom:0;padding:12px 0 8px;background:var(--bg);z-index:4}
.error{font-size:13px;color:#8f241c;background:var(--up-soft);padding:10px 12px;border-radius:8px;margin-bottom:10px}
.details{border-top:1px solid var(--line);padding-top:12px;margin:4px 0 8px}.details summary{font-size:14px;color:#3f5e67;cursor:pointer;min-height:44px;display:flex;align-items:center;gap:6px}
.detail-lead{display:flex;align-items:center;gap:12px;padding:2px 0 16px}.detail-lead .trade-icon{width:44px;height:44px;flex-basis:44px;font-size:16px;border-radius:12px}
.detail-lead strong{font-size:19px;display:block}.detail-lead small{font-size:13px;color:var(--muted)}
.definition{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 15px;margin:0 0 14px}
.definition>div{display:flex;justify-content:space-between;align-items:start;gap:20px;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px}
.definition>div:last-child{border:0}.definition dt{color:var(--muted)}.definition dd{margin:0;text-align:right;font-weight:600;max-width:68%;overflow-wrap:anywhere}
.big-detail{font-size:26px;font-weight:700;letter-spacing:-.5px;margin:0 0 16px}
.mini-heading{font-size:14px;font-weight:700;margin:18px 0 8px}
.toast{position:fixed;bottom:92px;left:50%;transform:translateX(-50%);z-index:100;background:var(--ink);color:#fff;border-radius:11px;padding:12px 18px;font-size:14px;box-shadow:var(--shadow);width:max-content;max-width:85%;text-align:center}
.notice{font-size:13px;line-height:1.75;padding:12px 14px;background:#e6f0f0;color:#33575e;border-radius:10px;margin-bottom:14px}
@media(min-width:600px){body{padding:24px 0}.app{min-height:calc(100dvh - 48px);border-radius:24px;box-shadow:0 20px 70px #253e4518}
 .nav{bottom:24px;border-radius:0 0 24px 24px;box-shadow:0 24px 0 0 var(--page)}.overlay{align-items:center}.sheet{border-radius:22px;max-height:88dvh}}
@media(prefers-reduced-motion:no-preference){.sheet{animation:rise .18s ease-out}.toast{animation:rise .15s ease-out}@keyframes rise{from{opacity:.3;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}}
[hidden]{display:none!important}
</style>
<script src="./firebase-config.js"></script></head>
<body>
<div class="app" id="app">
<header class="top"><div class="brand"><span class="brand-mark" id="brand-icon"></span>Stockbook <span class="badge">B 版</span></div><button class="account" id="account-switch" aria-label="切換帳本與帳戶"></button></header>
<main class="content" id="main"></main><nav class="nav" id="nav" aria-label="主要導覽"></nav>
</div>
<div id="sheets"></div><div id="live" aria-live="polite" role="status"></div>
<script type="module" src="./app-b.js"></script>
</body>
</html>
